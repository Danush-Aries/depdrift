[project]
name = "depdrift"
version = "0.1.0"
description = "Supply-chain diff for dependency lockfiles. Diffs two lockfiles (or one repo at two git refs), reports added/removed/upgraded deps with semver classification, and flags NEW risk on the changed set — known vulns (OSV.dev), typosquats, and abandonment. Cross-ecosystem, keyless, offline-testable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar" }]
keywords = ["supply-chain", "security", "dependencies", "lockfile", "osv", "typosquat",
            "semver", "diff", "pypi", "npm", "sca", "vulnerability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
depdrift = "depdrift.cli:app"

[project.urls]
Homepage = "https://github.com/Danush-Aries/depdrift"
Repository = "https://github.com/Danush-Aries/depdrift"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depdrift"]

[tool.hatch.build.targets.wheel.force-include]
"src/depdrift/enrich/data" = "depdrift/enrich/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
